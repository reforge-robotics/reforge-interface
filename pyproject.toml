[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]

[project]
name = "reforge-interface"
version = "0.1.0"
description = "Robot adapter layer for Reforge calibration and identification workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reforge Robotics", email = "info@reforgerobotics.com" }]
dependencies = [
    "numpy>=2,<3",
    "reforge-core[kinecal]>=2.0.14,<3",
    "standardbots",
]

[project.optional-dependencies]
ros = [
    "pydantic",
]
dev = [
    "pytest",
    "ruff",
    "black==24.1.1",
    "sounddevice",
]

[project.scripts]
reforge-robot = "robot.run:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
robot = [
    "models/current/*.pt",
    "urdf/*.urdf",
    "urdf/**/*.urdf",
    "urdf/**/*.xacro",
    "urdf/**/*.stl",
    "urdf/**/*.STL",
    "urdf/**/*.dae",
]
