[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "reforge-interface"
version = "0.1.0"
description = "Robot adapter layer for Reforge calibration and identification workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Reforge Robotics", email = "info@reforgerobotics.com" }]
# This list intentionally does not match src/robot/requirements.txt. This is
# the normal `pip install reforge-interface` dependency set, relying on real
# resolution to pull in reforge-core's transitive deps. requirements.txt
# exists separately because the Dockerfile installs reforge-core with
# --no-deps (no binary is published for 2.0.14, so it's built from source)
# and must therefore enumerate those transitive deps by hand. Keep both;
# don't try to reconcile them into one list.
dependencies = [
    "mcap-protobuf-support>=0.5,<0.6",
    "numpy>=2,<3",
    "ur-rtde==1.6.5",
    "reforge-core[all]",
]

[project.optional-dependencies]
ros = [
    "pydantic",
]
dev = [
    "pytest",
    "ruff",
    "black==24.1.1",
]

[project.scripts]
reforge-robot = "robot.run:main"

[tool.setuptools]
packages = ["robot"]
package-dir = { "robot" = "." }
include-package-data = false

[tool.setuptools.package-data]
robot = [
    "config/*.toml",
    "urdf/*.urdf",
    "urdf/**/*.urdf",
    "urdf/**/*.xacro",
    "urdf/**/*.stl",
    "urdf/**/*.dae",
]
