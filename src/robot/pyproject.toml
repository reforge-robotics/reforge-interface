[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "reforge-interface"
version = "0.1.0"
description = "Public robot adapter package for Reforge calibration workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Reforge Robotics", email = "info@reforgerobotics.com" }]
dynamic = ["dependencies"]

[project.scripts]
reforge-robot = "robot.run:main"

[tool.setuptools]
# The public export contains one ``robot`` namespace and any explicitly
# selected subpackages (for example the Denso vendor transport). The exporter
# places this file next to the package sources, so the package directory is
# the project directory.
packages = ["robot", "robot.vendor"]
package-dir = { "robot" = "." }
include-package-data = false

[tool.setuptools.dynamic]
# The exporter writes the selected, standalone requirements file beside this
# manifest.  Keeping this relationship structural prevents metadata drift.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
# The exporter renders the exact selected public file list here. Wildcards are
# deliberately not allowed: unmanaged files must never enter a public wheel.
robot = [
    "README.md",
    "config/kinecal_config.toml",
    "config/kinecal_config_default.toml",
    "data/README.md",
    "example_usage/joint_tracker/cpp/CMakeLists.txt",
    "example_usage/joint_tracker/cpp/README.md",
    "example_usage/joint_tracker/cpp/THIRD_PARTY_NOTICES.md",
    "example_usage/joint_tracker/cpp/main.cpp",
    "example_usage/joint_tracker/cpp/plotting/matplotlib_process_plotter.hpp",
    "example_usage/joint_tracker/example_models/joint_controller_models.json",
    "example_usage/joint_tracker/example_models/model_bundle.json",
    "example_usage/joint_tracker/python/example_utility.py",
