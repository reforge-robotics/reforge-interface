# Do not edit this file during normal operation.
# Copy this file over src/robot/config/kinecal_config.toml to restore default values.
eef_link = "link_eef"
probe_link = "smr_ball_link"
#probe_link = "prod_ball_link"

# recording_method = "keyboard"s
recording_method = "flange_button"

[tcp_config]
policy = "cones"
cones = [
  { angle_deg = 5.0, count = 5 },
  { angle_deg = 20.0, count = 10 },
  { angle_deg = 25.0, count = 10 },
  { angle_deg = 35.0, count = 10 },
  { angle_deg = 45.0, count = 10 },
]

[outlier_detection]
enabled = true
metric = "mahalanobis"
