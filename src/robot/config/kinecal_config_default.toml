# Do not edit this file during normal operation.
# Copy this file over kinecal_config.toml to restore default values.
eef_link = "ee_link"
# probe_link = "smr_ball_link"
probe_link = "prod_ball_link"

recording_method = "keyboard"
# keyboard_capture_key = "b"  # Omit to use the default, Enter.
# recording_method = "flange_button"

[tcp_config]
policy = "cones"
cones = [
  { angle_deg = 5.0, count = 4 },
  { angle_deg = 20.0, count = 8 },
  { angle_deg = 25.0, count = 8 },
  { angle_deg = 35.0, count = 8 },
  { angle_deg = 45.0, count = 8 },
]

[outlier_detection]
enabled = true
metric = "mahalanobis"
