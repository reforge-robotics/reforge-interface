<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./demo_pngs/Standard-bots-logo-favicon.png" />
    <title>Standard Bots</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background-image: url("./demo_pngs/Screenshot from 2026-03-12 11-58-35_cropped.png");
        background-size: contain;      /* fill screen */
        background-position: center; /* keep centered */
        background-repeat: no-repeat;
        background-attachment: fixed; /* optional */
      }

      reforge-robotics-widget {
        position: fixed;
        left: 20px;
        top: 54px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <script
      src="../ui-widget/reforge-robotics-widget.auto.js"
      data-base-url="http://<api_host>:8080"
      data-robot-ip="<robot_host>:3000"
      data-local-ip=""
      data-sdk-token="<sdk_token>"
      data-robot-id=""
      data-freq="200"
      data-reforge-identify-api-token="<reforge_api_token>"
      data-reforge-robot-id=""
    ></script>
  </body>
</html>
